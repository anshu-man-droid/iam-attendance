<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IAM - Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #000000; font-family: 'Lexend', sans-serif; color: #ffffff; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 40px 0; border-bottom: 1px solid #333; margin-bottom: 20px; }
        .prof-pic { width: 60px; height: 60px; background: #ffcc00; color: #000; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1.5rem; margin-right: 15px; }
        .faculty-info h2 { margin-bottom: 0; font-weight: 700; color: #ffcc00; }
        .faculty-info p { color: #888; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 1px; margin-bottom: 0; }
        
        .dashboard-section { background: #111111; border: 1px solid #222; border-radius: 24px; padding: 30px; margin-bottom: 30px; }
        
        /* Navigation Tabs Control Layout Styling */
        .nav-tabs { border-bottom: 2px solid #222; margin-bottom: 25px; }
        .nav-link { color: #888; font-weight: bold; border: none !important; text-transform: uppercase; padding: 12px 25px; }
        .nav-link:hover { color: #ffcc00; }
        .nav-link.active { background: transparent !important; color: #ffcc00 !important; border-bottom: 3px solid #ffcc00 !important; }

        .request-card { background: #000000; border: 1px solid #333; border-radius: 16px; padding: 20px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .request-details h5 { color: #ffcc00; margin-bottom: 5px; font-weight: bold; }
        .request-details p { margin-bottom: 0; font-size: 0.9rem; color: #aaa; }
        
        .btn-action-success { background: #198754; color: #fff; font-weight: 700; border: none; border-radius: 8px; padding: 8px 20px; }
        .btn-action-danger { background: #dc3545; color: #fff; font-weight: 700; border: none; border-radius: 8px; padding: 8px 20px; }
        .logout-btn { color: #ffcc00; font-weight: bold; text-decoration: none; }
        .hidden { display: none !important; }

        .badge-approved { background: #198754; padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; font-weight: bold; color: #fff; }
        .badge-rejected { background: #dc3545; padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; font-weight: bold; color: #fff; }
    </style>
</head>
<body class="container">

    <div class="header">
        <div class="d-flex align-items-center">
            <div class="prof-pic" id="initials">?</div>
            <div class="faculty-info">
                <h2 id="facName">Admin</h2>
                <p id="facRole">Admin View</p>
            </div>
        </div>
        <div>
            <a href="bridge.html" class="logout-btn me-4">BACK TO GATEWAY</a>
            <a href="#" class="logout-btn" onclick="logout()">LOGOUT</a>
        </div>
    </div>

    <ul class="nav nav-tabs">
        <li class="nav-item">
            <a class="nav-link active" id="tabRequests" href="#" onclick="switchView('Requests')">Requests Queue</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" id="tabHistory" href="#" onclick="switchView('History')">Processed History</a>
        </li>
    </ul>

    <div id="sectionRequests" class="dashboard-section">
        <h4 style="color: #ffcc00; font-weight: 700; margin-bottom: 20px;">Pending Action Queue</h4>
        <div id="adminQueueContainer">Loading requests...</div>
    </div>

    <div id="sectionHistory" class="dashboard-section hidden">
        <h4 style="color: #ffcc00; font-weight: 700; margin-bottom: 20px;">Review Actions Audit Log History</h4>
        <div id="adminHistoryContainer">Loading history...</div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw_B-F30oaY2TKb0HYWv7fCaMKAZ9Sek8sE6cKEEjN-IQ_-Ko7dNEVMom_r99z_R0f6/exec';
        const userData = JSON.parse(localStorage.getItem('facultyUser'));

        function formatDateString(rawDate) {
            if (!rawDate) return "";

            let dateStr = rawDate.toString().trim();
            if (dateStr.includes('T')) {
                dateStr = dateStr.split('T')[0];
            }

            if (dateStr.includes(' ') && !dateStr.includes('-')) {
                const d = new Date(dateStr);
                const day = String(d.getDate()).padStart(2, '0');
                const month = String(d.getMonth() + 1).padStart(2, '0');
                const year = String(d.getFullYear()).slice(-2);
                return `${day}-${month}-${year}`;
            }

            const parts = dateStr.split('-'); 
            if (parts.length === 3) {
                if (parts[0].length === 4) {
                    const year = parts[0].slice(-2);
                    const month = parts[1];
                    const day = parts[2];
                    return `${day}-${month}-${year}`;
                }
                return dateStr;
            }
            
            return dateStr;
        }

        // 🛡️ DUAL-LAYER CODE ROUTING PATTERN ASSERTION
        if (!userData || userData.name.trim() !== "Ken Seng Thoumoung" || userData.role !== 'Admin') {
            localStorage.removeItem('facultyUser');
            window.location.href = 'index.html';
        } else {
            document.getElementById('facName').innerText = userData.name;
            document.getElementById('initials').innerText = userData.name.charAt(0).toUpperCase();
            document.getElementById('facRole').innerText = "System Administrator"; // Keeps dashboard look pristine
            loadAdminDatabaseStreams();
        }

        function switchView(targetTab) {
            if (targetTab === 'Requests') {
                document.getElementById('tabRequests').classList.add('active');
                document.getElementById('tabHistory').classList.remove('active');
                document.getElementById('sectionRequests').classList.remove('hidden');
                document.getElementById('sectionHistory').classList.add('hidden');
            } else {
                document.getElementById('tabRequests').classList.remove('active');
                document.getElementById('tabHistory').classList.add('active');
                document.getElementById('sectionRequests').classList.add('hidden');
                document.getElementById('sectionHistory').classList.remove('hidden');
            }
        }

        async function loadAdminDatabaseStreams() {
            try {
                // Pass role validation context fields explicitly inside request body payloads
                const response = await fetch(SCRIPT_URL, { 
                    method: 'POST', 
                    body: JSON.stringify({ 
                        action: 'fetchLeaves',
                        facultyId: userData.facultyId,
                        role: userData.role 
                    }) 
                });
                const allRows = await response.json();
                
                const queueContainer = document.getElementById('adminQueueContainer');
                const historyContainer = document.getElementById('adminHistoryContainer');
                
                queueContainer.innerHTML = '';
                historyContainer.innerHTML = '';

                const pending = allRows.filter(r => r.status === 'Pending');
                const resolved = allRows.filter(r => r.status === 'Approved' || r.status === 'Rejected');

                if(pending.length === 0) {
                    queueContainer.innerHTML = `<p class="text-muted text-center py-3">🎉 All clear! No new leave applications waiting.</p>`;
                } else {
                    pending.forEach(req => {
                        queueContainer.innerHTML += `
                            <div class="request-card">
                                <div class="request-details">
                                    <h5>${req.name} (ID: ${req.facultyId})</h5>
                                    <p>Target Date: <b>${formatDateString(req.dates)}</b> | Classification: <b class="text-warning">${req.leaveType}</b></p>
                                    <p class="small text-secondary">Token: ${req.requestId}</p>
                                </div>
                                <div>
                                    <button class="btn btn-action-success me-2" onclick="executeDecision('${req.requestId}', 'Approved')">Approve</button>
                                    <button class="btn btn-action-danger" onclick="executeDecision('${req.requestId}', 'Rejected')">Reject</button>
                                </div>
                            </div>`;
                    });
                }

                if(resolved.length === 0) {
                    historyContainer.innerHTML = `<p class="text-muted text-center py-3">No processed entries on file yet.</p>`;
                } else {
                    resolved.reverse().forEach(req => {
                        const statusClass = req.status === 'Approved' ? 'badge-approved' : 'badge-rejected';
                        historyContainer.innerHTML += `
                            <div class="request-card" style="opacity: 0.75;">
                                <div class="request-details">
                                    <h5>${req.name} (ID: ${req.facultyId})</h5>
                                    <p>Target Date: <b>${formatDateString(req.dates)}</b> | Type: <b>${req.leaveType}</b></p>
                                </div>
                                <div><span class="${statusClass}">${req.status.toUpperCase()}</span></div>
                            </div>`;
                    });
                }
            } catch(e) { console.log(e); }
        }

        async function executeDecision(reqId, decision) {
            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ 
                        action: 'reviewLeave', 
                        adminRole: userData.role, // Passes "Admin" safely via session memory injection token
                        requestId: reqId, 
                        status: decision 
                    })
                });
                const result = await response.text();
                if (result === "STATUS_UPDATED") {
                    alert(`Success: Action recorded.`);
                    loadAdminDatabaseStreams();
                }
            } catch(e) { alert("Error connecting to database."); }
        }

        function logout() { localStorage.removeItem('facultyUser'); window.location.href = 'index.html'; }
    </script>
</body>
</html>
