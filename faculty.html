<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IAM - Faculty Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/dark.css">
    
    <style>
        body { background-color: #000000; font-family: 'Lexend', sans-serif; color: #ffffff; padding-bottom: 50px; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 40px 0; border-bottom: 1px solid #333; margin-bottom: 40px; }
        .prof-pic { width: 60px; height: 60px; background: #ffcc00; color: #000; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1.5rem; margin-right: 15px; }
        .faculty-info h2 { margin-bottom: 0; font-weight: 700; color: #ffcc00; }
        .faculty-info p { color: #888; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 1px; margin-bottom: 0; }
        
        .menu-card { background: #000000; border-radius: 24px; padding: 40px; text-align: center; border: 1px solid #333; transition: 0.3s; cursor: pointer; height: 100%; }
        .menu-card:hover { border-color: #ffcc00; transform: translateY(-5px); }
        .menu-card h3 { font-weight: 700; color: #ffcc00; }
        
        .metric-card { background: #111111; border: 1px solid #222; border-radius: 20px; padding: 20px; text-align: center; }
        .metric-val { font-size: 2rem; font-weight: 700; color: #ffcc00; margin-top: 5px; }
        .metric-label { font-size: 0.75rem; color: #888; text-transform: uppercase; font-weight: bold; letter-spacing: 1px; }

        .dashboard-section { background: #111111; border: 1px solid #222; border-radius: 24px; padding: 30px; margin-top: 30px; }
        .section-title { color: #ffcc00; font-weight: 700; margin-bottom: 20px; border-bottom: 1px solid #222; padding-bottom: 10px; }
        .form-label { font-weight: 700; font-size: 0.8rem; color: #ffcc00; text-transform: uppercase; margin-bottom: 8px; }
        
        .form-control { background: #ffcc00 !important; border: 2px solid #000000 !important; border-radius: 12px !important; padding: 10px 15px !important; color: #000 !important; font-weight: bold !important; }
        .btn-yellow { background: #ffcc00; color: #000; font-weight: 700; border-radius: 12px; padding: 10px 20px; border: none; text-transform: uppercase; }
        .btn-yellow:hover { background: #fff; color: #000; }
        .logout-btn { color: #ffcc00; font-weight: bold; text-decoration: none; }
        .hidden { display: none !important; }
        
        .badge-pending { background: #ffc107; color: #000; padding: 5px 10px; border-radius: 8px; font-weight: bold; font-size: 0.8rem; }
        .badge-approved { background: #198754; color: #fff; padding: 5px 10px; border-radius: 8px; font-weight: bold; font-size: 0.8rem; }
        .badge-rejected { background: #dc3545; color: #fff; padding: 5px 10px; border-radius: 8px; font-weight: bold; font-size: 0.8rem; }
        .history-table { width: 100%; margin-top: 15px; color: #fff; }
        .history-table th { color: #ffcc00; border-bottom: 1px solid #333; padding: 10px; }
        .history-table td { padding: 12px 10px; border-bottom: 1px solid #222; font-size: 0.95rem; }

        .flatpickr-calendar { background: #111111 !important; border: 1px solid #333 !important; box-shadow: none !important; }
        .flatpickr-day.selected { background: #ffcc00 !important; border-color: #ffcc00 !important; color: #000 !important; font-weight: bold; }
        .flatpickr-day:hover { background: #222 !important; }

        .nav-tabs { border-bottom: 2px solid #222; margin-bottom: 25px; }
        .nav-link { color: #888; font-weight: bold; border: none !important; text-transform: uppercase; padding: 12px 25px; text-decoration: none; }
        .nav-link:hover { color: #ffcc00; }
        .nav-link.active { background: transparent !important; color: #ffcc00 !important; border-bottom: 3px solid #ffcc00 !important; }
    </style>
</head>
<body class="container">

    <div class="header">
        <div class="d-flex align-items-center">
            <div class="prof-pic" id="initials">?</div>
            <div class="faculty-info">
                <h2 id="facName">Loading...</h2>
                <p id="facRole">Faculty View</p>
            </div>
        </div>
        <div>
            <a href="bridge.html" id="backToGatewayBtn" class="logout-btn me-4 hidden">BACK TO GATEWAY</a>
            <a href="#" class="logout-btn" onclick="logout()">LOGOUT</a>
        </div>
    </div>

    <ul class="nav nav-tabs">
        <li class="nav-item"><a class="nav-link active" href="faculty.html">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="faculty_calender.html">Leave Calendar View</a></li>
        <li class="nav-item"><a class="nav-link" href="faculty_analysis.html">Monthly Analysis</a></li>
    </ul>

    <div id="viewMainDashboard">
        <div class="row g-4 mt-2">
            <div class="col-md-6"><div class="menu-card" onclick="logTime('Logged In')"><h3>In</h3></div></div>
            <div class="col-md-6"><div class="menu-card" onclick="logTime('Logged Out')"><h3>Out</h3></div></div>
        </div>

        <div class="row g-3 mt-4">
            <div class="col-3 col-md-3">
                <div class="metric-card">
                    <div class="metric-label" id="lblTotal">Total CL</div>
                    <div class="metric-val" id="statTotal">--</div>
                </div>
            </div>
            <div class="col-3 col-md-3">
                <div class="metric-card">
                    <div class="metric-label" id="lblUsed">Used CL</div>
                    <div class="metric-val" id="statUsed">--</div>
                </div>
            </div>
            <div class="col-3 col-md-3">
                <div class="metric-card" style="border-color: #ffcc00;">
                    <div class="metric-label" id="lblPending" style="color: #ffcc00;">Pending CL</div>
                    <div class="metric-val" id="statPending">--</div>
                </div>
            </div>
            <div class="col-3 col-md-3">
                <div class="metric-card" style="border-color: #dc3545;">
                    <div class="metric-label" style="color: #dc3545;">Current LOP</div>
                    <div class="metric-val" id="statLOP" style="color: #ffffff;">0</div>
                </div>
            </div>
        </div>

        <div class="dashboard-section">
            <h4 class="section-title">Request Leave Dates</h4>
            <div class="row g-3 align-items-end d-flex">
                <div class="col-md-5" id="calendarCol">
                    <label class="form-label">Select Leaves on Calendar</label>
                    <input type="text" id="leaveCalendar" class="form-control" placeholder="Click to choose dates..." style="height: 46px;">
                </div>
                <div class="col-md-4" id="typeCol">
                    <label class="form-label">Leave Type</label>
                    <select id="leaveType" class="form-select" onchange="updateLeaveTypeMetrics(); handleLeaveTypeChange();" style="background: #ffcc00; border: 2px solid #000; border-radius: 12px; padding: 10px; font-weight: bold; color: #000; height: 46px;">
                        <option value="Casual Leave">Casual Leave (CL)</option>
                        <option value="Sick Leave">Sick Leave (SL)</option>
                    </select>
                </div>
                <div class="col-md-3" id="submitBtnCol">
                    <button class="btn btn-yellow w-100 py-2" onclick="submitLeaveRequest()" style="height: 46px; line-height: 26px;">Submit Request</button>
                </div>
            </div>
            <div id="tokenCalculationFeedback" class="small text-warning mt-3 font-weight-bold" style="letter-spacing: 0.5px; font-size: 0.95rem;"></div>
        </div>
    </div>

    <div class="dashboard-section">
        <h4 class="section-title">Your Leave Tracking History</h4>
        <div class="table-responsive">
            <table class="history-table">
                <thead>
                    <tr><th>Leave Type</th><th>Requested Date(s)</th><th>Approval Status Update</th></tr>
                </thead>
                <tbody id="leaveHistoryTableBody">
                    <tr><td colspan="3" class="text-muted text-center">Loading status logs...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz6S0IIRfQ6OWRs8hx-ZuSoRf9cGdlAG2R3eX6jG7ITd4W383FkVkAKpXUVTzRryEDP/exec';
        let fpInstance = null; 
        let userData = JSON.parse(localStorage.getItem('facultyUser'));

        function formatDateString(rawDate) {
            if (!rawDate) return "";
            let str = rawDate.toString().trim();
            if (str.includes(',')) {
                return str.split(',').map(datePart => {
                    let cleanPart = datePart.trim().split('T')[0].split(' ')[0];
                    const parts = cleanPart.split('-');
                    if (parts.length === 3 && parts[0].length === 4) { return `${parts[2]}-${parts[1]}-${parts[0].slice(-2)}`; }
                    return cleanPart;
                }).join(', '); 
            }
            let dateStr = str.split('T')[0].split(' ')[0];
            const parts = dateStr.split('-'); 
            if (parts.length === 3 && parts[0].length === 4) { return `${parts[2]}-${parts[1]}-${parts[0].slice(-2)}`; }
            return dateStr;
        }

        function handleLeaveTypeChange() { calculateFlexibleTokens(); }
        function generateDynamicDateGrid() { calculateFlexibleTokens(); }

        function calculateFlexibleTokens() {
            if (!fpInstance || fpInstance.selectedDates.length === 0) {
                document.getElementById('tokenCalculationFeedback').innerText = "";
                return 0;
            }
            const typeVal = document.getElementById('leaveType').value;
            const totalDatesSelected = fpInstance.selectedDates.length;
            const shorthand = typeVal === "Casual Leave" ? "CL" : "SL";
            document.getElementById('tokenCalculationFeedback').innerText = `Total ${shorthand} Tokens to be Debited: ${totalDatesSelected}`;
            return totalDatesSelected;
        }

        function updateLeaveTypeMetrics() {
            if (!userData) return;
            const activeType = document.getElementById('leaveType').value;
            let total = 0, used = 0, pending = 0;

            if (activeType === "Casual Leave") {
                document.getElementById('lblTotal').innerText = "Total CL";
                document.getElementById('lblUsed').innerText = "Used CL";
                document.getElementById('lblPending').innerText = "Pending CL";
                total = userData.totalCL !== undefined ? userData.totalCL : 12; 
                used = userData.usedCL !== undefined ? userData.usedCL : 0;
                pending = userData.pendingCL !== undefined ? userData.pendingCL : 12;
            } else {
                document.getElementById('lblTotal').innerText = "Total SL";
                document.getElementById('lblUsed').innerText = "Used SL";
                document.getElementById('lblPending').innerText = "Pending SL";
                total = userData.totalSL !== undefined ? userData.totalSL : 6; 
                used = userData.usedSL !== undefined ? userData.usedSL : 0;
                pending = userData.pendingSL !== undefined ? userData.pendingSL : 6;
            }

            document.getElementById('statTotal').innerText = total;
            document.getElementById('statUsed').innerText = used;
            document.getElementById('statPending').innerText = pending;
            document.getElementById('statLOP').innerText = userData.currentLOP !== undefined ? userData.currentLOP : 0;
            if (fpInstance) { fpInstance.clear(); }
        }

        if (!userData) {
            window.location.href = 'index.html';
        } else {
            if (userData.regDate) {
                let checkDate = userData.regDate.toString();
                if (checkDate.includes('T') || checkDate.includes(' ') || checkDate.includes('GMT')) {
                    userData.regDate = checkDate.split('T')[0].split(' ')[0].trim();
                    localStorage.setItem('facultyUser', JSON.stringify(userData));
                }
            }
            document.getElementById('facName').innerText = userData.name;
            document.getElementById('initials').innerText = userData.name.charAt(0).toUpperCase();
            document.getElementById('facRole').innerText = `${userData.dept} Instructor`;

            if (userData.name.trim() === "Ken Seng Thoumoung" && userData.role === "Admin") {
                document.getElementById('backToGatewayBtn').classList.remove('hidden');
            } else {
                document.getElementById('backToGatewayBtn').classList.add('hidden');
            }

            let minDateLimit = userData.regDate ? userData.regDate.toString().trim() : "2026-01-01";
            fpInstance = flatpickr("#leaveCalendar", {
                mode: "multiple",
                dateFormat: "Y-m-d",
                minDate: minDateLimit,
                conjunction: ", ",
                onChange: function() { generateDynamicDateGrid(); }
            });

            updateLeaveTypeMetrics();
            handleLeaveTypeChange();
            fetchUpdatedLeaveNumbers();
            fetchUserLeaveHistory();
        }

        async function fetchUpdatedLeaveNumbers() {
            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'login', facultyId: userData.facultyId, password: userData.password || "SESSION_RESYNC" })
                });
                const freshData = await response.json();
                if(freshData !== "Fail") {
                    userData.totalCL = freshData.totalCL; userData.usedCL = freshData.usedCL; userData.pendingCL = freshData.pendingCL;
                    userData.totalSL = freshData.totalSL; userData.usedSL = freshData.usedSL; userData.pendingSL = freshData.pendingSL;
                    userData.currentLOP = freshData.currentLOP; 
                    localStorage.setItem('facultyUser', JSON.stringify(userData));
                    updateLeaveTypeMetrics();
                }
            } catch(e) { console.error(e); }
        }

        async function fetchUserLeaveHistory() {
            try {
                const userRole = (userData && userData.role) ? userData.role : "Faculty";
                const facId = (userData && userData.facultyId) ? userData.facultyId : "";

                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'fetchLeaves', facultyId: facId, role: userRole, caller: 'FacultyDashboard' })
                });
                const resData = await response.json();
                const list = resData.leaves ? resData.leaves : (Array.isArray(resData) ? resData : []);
                
                const historyContainer = document.getElementById('leaveHistoryTableBody'); 
                if (!historyContainer) return;
                historyContainer.innerHTML = '';

                if (!list || list.length === 0) {
                    historyContainer.innerHTML = `<tr><td colspan="3" class="text-muted text-center py-4">No leave entries found.</td></tr>`;
                    return;
                }

                const renderedRows = [...list].reverse();
                
                renderedRows.forEach((req, idx) => {
                    if (!req) return;

                    let statusBadge = '';
                    const currentStatus = req.status ? req.status.toString().trim() : 'Pending';

                    if (currentStatus === 'Pending') statusBadge = '<span class="badge bg-warning text-dark status-toggle" style="cursor:pointer;">PENDING ▾</span>';
                    else if (currentStatus === 'Approved') statusBadge = '<span class="badge bg-success status-toggle" style="cursor:pointer;">APPROVED ▾</span>';
                    else statusBadge = '<span class="badge bg-danger status-toggle" style="cursor:pointer;">REJECTED ▾</span>';

                    let rawLeaveType = req.leaveType ? req.leaveType.toString() : 'Leave Request';
                    let baseTypeDisplay = rawLeaveType.split(':')[0]; 
                    let breakdownHTML = '';

                    let rawDatesStr = req.dates ? req.dates.toString() : '';
                    let datesArray = rawDatesStr.split(',').map(d => d.trim()).filter(d => d !== '');

                    if (currentStatus === 'Approved' && rawLeaveType.includes(':')) {
                        try {
                            let parts = rawLeaveType.split(':')[1].split(',');
                            parts.forEach(part => {
                                let trimmed = part.trim();
                                let datePart = trimmed.split('(')[0];
                                let typePart = trimmed.includes('(') ? trimmed.split('(')[1].replace(')', '') : 'CL';
                                let badgeStyle = typePart === 'LOP' ? 'border: 1px solid #dc3545; color: #dc3545;' : 'border: 1px solid #ffcc00; color: #ffcc00;';
                                breakdownHTML += `
                                    <div class="d-flex align-items-center justify-content-between p-2 mb-2 rounded" style="background: #000; border: 1px solid #222;">
                                        <span class="small fw-bold">${formatDateString(datePart)}</span>
                                        <span class="small fw-bold px-2 py-1 rounded" style="${badgeStyle} font-size: 0.75rem;">${typePart === 'LOP' ? 'LOP (Unpaid)' : typePart + ' Token'}</span>
                                    </div>`;
                            });
                        } catch (err) { breakdownHTML = `<div class="text-muted small">Error parsing approval details.</div>`; }
                    } else if (currentStatus === 'Rejected') {
                        datesArray.forEach(dStr => {
                            breakdownHTML += `
                                <div class="d-flex align-items-center justify-content-between p-2 mb-2 rounded" style="background: #000; border: 1px solid #222;">
                                    <span class="small fw-bold">${formatDateString(dStr)}</span>
                                    <span class="small fw-bold px-2 py-1 rounded" style="border: 1px solid #dc3545; color: #dc3545; font-size: 0.75rem;">Rejected</span>
                                </div>`;
                        });
                    } else {
                        datesArray.forEach(dStr => {
                            breakdownHTML += `
                                <div class="d-flex align-items-center justify-content-between p-2 mb-2 rounded" style="background: #000; border: 1px solid #222;">
                                    <span class="small fw-bold">${formatDateString(dStr)}</span>
                                    <span class="small fw-bold px-2 py-1 rounded" style="border: 1px solid #aaa; color: #aaa; font-size: 0.75rem;">Pending Review</span>
                                </div>`;
                        });
                    }

                    historyContainer.innerHTML += `
                        <tr>
                            <td class="fw-bold text-uppercase" style="font-size: 0.85rem; color: #aaa; padding: 12px 10px; border-bottom: 1px solid #222;">${baseTypeDisplay}</td>
                            <td style="padding: 12px 10px; border-bottom: 1px solid #222;"><b>${formatDateString(rawDatesStr)}</b></td>
                            <td style="padding: 12px 10px; border-bottom: 1px solid #222;" onclick="toggleBreakdownRow(${idx})">${statusBadge}</td>
                        </tr>
                        <tr id="breakdownRow_${idx}" class="hidden" style="background: #141414;">
                            <td colspan="3" style="padding: 15px 20px; border-bottom: 1px solid #222;">
                                <div style="max-width: 400px;">
                                    <h6 class="text-warning small fw-bold text-uppercase mb-3" style="letter-spacing: 0.5px; font-size: 0.75rem;">Date Classification Breakdown:</h6>
                                    ${breakdownHTML}
                                </div>
                            </td>
                        </tr>`;
                });
            } catch(e) { 
                console.log("History syncing error:", e);
                const container = document.getElementById('leaveHistoryTableBody');
                if (container) container.innerHTML = `<tr><td colspan="3" class="text-center text-danger py-3">Error processing system sync logs.</td></tr>`;
            }
        }

        function toggleBreakdownRow(rowIndex) { document.getElementById(`breakdownRow_${rowIndex}`).classList.toggle('hidden'); }

        async function submitLeaveRequest() {
            if (!fpInstance || fpInstance.selectedDates.length === 0) { return alert("Please select one or more dates on the calendar first."); }
            const typeVal = document.getElementById('leaveType').value;
            const selectedDatesArray = fpInstance.selectedDates.map(d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`);
            selectedDatesArray.sort();
            const totalTokensRequested = calculateFlexibleTokens();
            const currentPendingBalance = Number(document.getElementById('statPending').innerText) || 0;
            const shorthandLabel = typeVal === "Casual Leave" ? "CL" : "SL";

            if (totalTokensRequested > currentPendingBalance) {
                let unpaidSpilloverAmount = totalTokensRequested - currentPendingBalance;
                let proceedWithSpillover = confirm(`ℹ️ Notice: You only have ${currentPendingBalance} ${shorthandLabel} token(s) remaining. Submitting this request will automatically allocate ${unpaidSpilloverAmount} day(s) as Loss of Pay (LOP / Unpaid Leave). Do you wish to proceed?`);
                if (!proceedWithSpillover) return;
            }

            let existingCLDates = []; let existingSLDates = [];
            const historyRows = document.querySelectorAll('#leaveHistoryTableBody tr:not([id^="breakdownRow_"])');
            historyRows.forEach(row => {
                const cells = row.getElementsByTagName('td');
                if (cells.length >= 3) {
                    const rowStatus = cells[2].innerText.toUpperCase();
                    if (rowStatus.includes("APPROVED") || rowStatus.includes("PENDING")) {
                        const rowLeaveType = cells[0].innerText.toUpperCase();
                        const rowDatesStr = cells[1].innerText.trim();
                        const rawDates = rowDatesStr.split(',').map(d => {
                            const p = d.trim().split('-');
                            if (p.length === 3) { return `20${p[2]}-${p[1]}-${p[0]}`; }
                            return "";
                        }).filter(d => d !== "");
                        if (rowLeaveType.includes("CASUAL")) existingCLDates = existingCLDates.concat(rawDates);
                        else if (rowLeaveType.includes("SICK")) existingSLDates = existingSLDates.concat(rawDates);
                    }
                }
            });

            for (let targetDate of selectedDatesArray) {
                let currentTargetTime = new Date(targetDate.replace(/-/g, '/'));
                let dayBeforeObj = new Date(currentTargetTime.getTime() - (24 * 60 * 60 * 1000));
                let dayAfterObj = new Date(currentTargetTime.getTime() + (24 * 60 * 60 * 1000));

                let dayBeforeStr = `${dayBeforeObj.getFullYear()}-${String(dayBeforeObj.getMonth() + 1).padStart(2, '0')}-${String(dayBeforeObj.getDate()).padStart(2, '0')}`;
                let dayAfterStr = `${dayAfterObj.getFullYear()}-${String(dayAfterObj.getMonth() + 1).padStart(2, '0')}-${String(dayAfterObj.getDate()).padStart(2, '0')}`;

                if (existingCLDates.concat(existingSLDates).includes(targetDate)) {
                    return alert(`❌ Access Denied: You already have an active leave request on ${formatDateString(targetDate)}!`);
                }
                if (existingCLDates.concat(existingSLDates).includes(dayBeforeStr)) {
                    return alert(`❌ Policy Violation: You cannot request a leave on ${formatDateString(targetDate)} because you have an active leave on the day before (${formatDateString(dayBeforeStr)}).`);
                }
                if (existingCLDates.concat(existingSLDates).includes(dayAfterStr)) {
                    return alert(`❌ Policy Violation: You cannot request a leave on ${formatDateString(targetDate)} because you have an active leave on the day after (${formatDateString(dayAfterStr)}).`);
                }
            }

            let maxInternalConsecutiveRun = 1; let currentRun = 1;
            for (let i = 1; i < selectedDatesArray.length; i++) {
                const prev = new Date(selectedDatesArray[i-1].replace(/-/g, '/'));
                const curr = new Date(selectedDatesArray[i].replace(/-/g, '/'));
                const gap = Math.ceil((curr - prev) / (1000 * 60 * 60 * 24));
                if (gap === 1) currentRun++;
                else {
                    if (currentRun > maxInternalConsecutiveRun) maxInternalConsecutiveRun = currentRun;
                    currentRun = 1;
                }
            }
            if (currentRun > maxInternalConsecutiveRun) maxInternalConsecutiveRun = currentRun;

            if (typeVal === "Casual Leave" && maxInternalConsecutiveRun > 5) { return alert("❌ Access Denied: A maximum of 5 days of Casual Leave may be availed consecutively!"); }
            if (typeVal === "Sick Leave" && maxInternalConsecutiveRun >= 3) {
                const proceedWithSL = confirm("⚠️ Policy Notice: Sick leave claims of 3 or more consecutive days must be supported with a valid Medical Certificate!");
                if (!proceedWithSL) return;
            }

            // =========================================================================
            // 🍏 WI-FI PROTECTION: DISABLE BUTTON TO PREVENT ACCIDENT DOUBLE-SUBMISSION
            // =========================================================================
            const submitBtn = document.querySelector('#submitBtnCol button');
            let originalBtnText = "Submit Request";
            if (submitBtn) {
                originalBtnText = submitBtn.innerText;
                submitBtn.disabled = true;
                submitBtn.innerText = "Submitting Request...";
                submitBtn.style.opacity = "0.6";
                submitBtn.style.cursor = "not-allowed";
            }

            // =========================================================================
            // 🍏 WI-FI PROTECTION: ABORT TIMEOUT ENGINE (15 SECONDS)
            // =========================================================================
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 15000); // 15000ms = 15 seconds

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    signal: controller.signal, // Connects the timeout abort controller wire
                    body: JSON.stringify({
                        action: 'requestLeave', facultyId: userData.facultyId, name: userData.name,
                        dates: selectedDatesArray.join(", "), leaveType: typeVal, calculatedDays: totalTokensRequested 
                    })
                });
                
                // Clear the timeout safety counter immediately since the server responded in time
                clearTimeout(timeoutId);
                
                const result = await response.text();
                if(result === "LEAVE_REQUESTED") {
                    alert(`✅ Successfully submitted a request for ${totalTokensRequested} token(s)!`);
                    if (fpInstance) fpInstance.clear();
                    document.getElementById('tokenCalculationFeedback').innerText = "";
                    
                    // Sync backend data logs back down onto the web layouts
                    await fetchUserLeaveHistory(); 
                    await fetchUpdatedLeaveNumbers();
                } else {
                    alert("❌ Server rejected processing request: " + result);
                }
            } catch (e) { 
                clearTimeout(timeoutId); // Make sure the timer turns off on failures
                console.error("Submission error stream details:", e);
                
                // Check if the catch block triggered because the AbortController terminated the request
                if (e.name === 'AbortError') {
                    alert("⚠️ Network Timeout: Your Wi-Fi connection appears weak or unstable. The server took too long to respond. Please check your internet signal and try again!");
                } else {
                    alert("❌ Submission failed due to a network connection error. Please check your internet and try again.");
                }
            } finally {
                // =========================================================================
                // 🍏 RESET ENGINE: RE-ENABLE BUTTON AFTER ALL PROCESSING STREAMS TERMINATE
                // =========================================================================
                if (submitBtn) {
                    submitBtn.disabled = false;
                    submitBtn.innerText = originalBtnText;
                    submitBtn.style.opacity = "1";
                    submitBtn.style.cursor = "pointer";
                }
            }
        }

        async function logTime(type) {
            // 1. Identify which card was clicked based on the type ('Logged In' or 'Logged Out')
            // We target the inner h3 text container to toggle a loading state
            const cards = document.querySelectorAll('.menu-card');
            let targetCard = null;
            
            cards.forEach(card => {
                if (card.innerText.includes(type === 'Logged In' ? 'In' : 'Out')) {
                    targetCard = card;
                }
            });

            const originalHTML = targetCard ? targetCard.innerHTML : "";

            // 2. IMMEDIATELY lock the interaction state to prevent spam clicks
            if (targetCard) {
                targetCard.style.pointerEvents = "none"; // Disables clicks on the div wrapper
                targetCard.style.opacity = "0.6";
                targetCard.innerHTML = `<h3>Processing...</h3>`;
            }

            try {
                // Fetch the user's IP address
                const ipResponse = await fetch('https://api.ipify.org?format=json');
                const ipData = await ipResponse.json();
                
                const payload = { 
                    action: 'logAttendance', 
                    facultyId: userData.facultyId, 
                    name: userData.name, 
                    role: userData.dept, 
                    type: type, 
                    clientIP: ipData.ip 
                };
                
                // Fire request to your Google Apps Script backend
                const response = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
                const result = await response.text();
                
                alert(result === "SUCCESS" ? `✅ Recorded: ${type}` : "❌ Access Denied.");
            } catch (e) { 
                console.error("Attendance log sync failure:", e);
                alert("Connection error. Attendance could not be logged."); 
            } finally {
                // 3. RESET ENGINE: Safely unlock the UI elements once network operations terminate
                if (targetCard) {
                    targetCard.style.pointerEvents = "auto";
                    targetCard.style.opacity = "1";
                    targetCard.innerHTML = originalHTML;
                }
            }
        }

        // 🍏 KEYBOARD SHORTCUT: CAPTURE ENTER KEY EXCLUSIVELY FOR LEAVE SUBMISSIONS
        document.addEventListener("DOMContentLoaded", () => {
            // Selects the main dashboard leave request container layout block
            const leaveSection = document.querySelector(".dashboard-section");
            
            if (leaveSection) {
                leaveSection.addEventListener("keydown", (event) => {
                    // Ensure the user is pressing Enter specifically within this section
                    if (event.key === "Enter") {
                        event.preventDefault();      // Stops standard browser bubbling
                        submitLeaveRequest();        // Executes your secure submission routine
                    }
                });
            }
        });

        function logout() { localStorage.removeItem('facultyUser'); window.location.href = 'index.html'; }
    </script>
