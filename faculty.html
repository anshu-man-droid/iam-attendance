<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IAM - Faculty Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #000000; font-family: 'Lexend', sans-serif; color: #ffffff; padding-bottom: 50px; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 40px 0; border-bottom: 1px solid #333; margin-bottom: 40px; }
        .prof-pic { width: 60px; height: 60px; background: #ffcc00; color: #000; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1.5rem; margin-right: 15px; }
        .faculty-info h2 { margin-bottom: 0; font-weight: 700; color: #ffcc00; }
        .faculty-info p { color: #888; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 1px; margin-bottom: 0; }
        
        .menu-card { background: #000000; border-radius: 24px; padding: 40px; text-align: center; border: 1px solid #333; transition: 0.3s; cursor: pointer; height: 100%; }
        .menu-card:hover { border-color: #ffcc00; transform: translateY(-5px); }
        .menu-card h3 { font-weight: 700; color: #ffcc00; }
        
        /* Metric Cards Styling */
        .metric-card { background: #111111; border: 1px solid #222; border-radius: 20px; padding: 20px; text-align: center; }
        .metric-val { font-size: 2rem; font-weight: 700; color: #ffcc00; margin-top: 5px; }
        .metric-label { font-size: 0.75rem; color: #888; text-transform: uppercase; font-weight: bold; letter-spacing: 1px; }

        .dashboard-section { background: #111111; border: 1px solid #222; border-radius: 24px; padding: 30px; margin-top: 30px; }
        .section-title { color: #ffcc00; font-weight: 700; margin-bottom: 20px; border-bottom: 1px solid #222; padding-bottom: 10px; }
        .form-label { font-weight: 700; font-size: 0.8rem; color: #ffcc00; text-transform: uppercase; margin-bottom: 8px; }
        .form-control { background: #ffcc00; border: 2px solid #000000; border-radius: 12px; padding: 10px 15px; color: #000; font-weight: bold; }
        .btn-yellow { background: #ffcc00; color: #000; font-weight: 700; border-radius: 12px; padding: 10px 20px; border: none; text-transform: uppercase; }
        .btn-yellow:hover { background: #fff; color: #000; }
        .logout-btn { color: #ffcc00; font-weight: bold; text-decoration: none; }
        .hidden { display: none !important; }
        
        /* Status Badges */
        .badge-pending { background: #ffc107; color: #000; padding: 5px 10px; border-radius: 8px; font-weight: bold; font-size: 0.8rem; }
        .badge-approved { background: #198754; color: #fff; padding: 5px 10px; border-radius: 8px; font-weight: bold; font-size: 0.8rem; }
        .badge-rejected { background: #dc3545; color: #fff; padding: 5px 10px; border-radius: 8px; font-weight: bold; font-size: 0.8rem; }
        .history-table { width: 100%; margin-top: 15px; color: #fff; }
        .history-table th { color: #ffcc00; border-bottom: 1px solid #333; padding: 10px; }
        .history-table td { padding: 12px 10px; border-bottom: 1px solid #222; font-size: 0.95rem; }
    </style>
</head>
<body class="container">

    <div class="header">
        <div class="d-flex align-items-center">
            <div class="prof-pic" id="initials">?</div>
            <div class="faculty-info">
                <h2 id="facName">Loading...</h2>
                <p id="facRole">Faculty View</p>
            </div>
        </div>
        <div>
            <a href="bridge.html" id="backToGatewayBtn" class="logout-btn me-4 hidden">BACK TO GATEWAY</a>
            <a href="#" class="logout-btn" onclick="logout()">LOGOUT</a>
        </div>
    </div>

    <div class="row g-4 mt-2">
        <div class="col-md-6">
            <div class="menu-card" onclick="logTime('Logged In')"><h3>In</h3></div>
        </div>
        <div class="col-md-6">
            <div class="menu-card" onclick="logTime('Logged Out')"><h3>Out</h3></div>
        </div>
    </div>

    <div class="row g-3 mt-4">
        <div class="col-4 col-md-4">
            <div class="metric-card">
                <div class="metric-label">Total Leaves</div>
                <div class="metric-val" id="statTotal">--</div>
            </div>
        </div>
        <div class="col-4 col-md-4">
            <div class="metric-card">
                <div class="metric-label">Used Leaves</div>
                <div class="metric-val" id="statUsed">--</div>
            </div>
        </div>
        <div class="col-4 col-md-4">
            <div class="metric-card" style="border-color: #ffcc00;">
                <div class="metric-label" style="color: #ffcc00;">Pending Leaves</div>
                <div class="metric-val" id="statPending">--</div>
            </div>
        </div>
    </div>

    <div class="dashboard-section">
        <h4 class="section-title">Request Leave Dates</h4>
        <div class="row g-3">
            <div class="col-md-4">
                <label class="form-label">Choose Target Date</label>
                <input type="date" id="leaveCalendar" class="form-control">
            </div>
            <div class="col-md-4">
                <label class="form-label">Leave Type</label>
                <select id="leaveType" class="form-select" style="background: #ffcc00; border: 2px solid #000; border-radius: 12px; padding: 10px; font-weight: bold; color: #000;">
                    <option value="Casual Leave">Casual Leave</option>
                    <option value="Sick Leave">Sick Leave</option>
                    <option value="Earned Leave">Earned Leave</option>
                    <option value="Personal Leave">Personal Leave</option>
                </select>
            </div>
            <div class="col-md-4 d-flex align-items-end">
                <button class="btn btn-yellow w-100 py-2" onclick="submitLeaveRequest()">Submit Request</button>
            </div>
        </div>
    </div>

    <div class="dashboard-section">
        <h4 class="section-title">Your Leave Tracking History</h4>
        <div class="table-responsive">
            <table class="history-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Requested Date</th>
                        <th>Approval Status Update</th>
                    </tr>
                </thead>
                <tbody id="historyQueue">
                    <tr><td colspan="3" class="text-muted text-center">Loading status logs...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw_B-F30oaY2TKb0HYWv7fCaMKAZ9Sek8sE6cKEEjN-IQ_-Ko7dNEVMom_r99z_R0f6/exec';
        
        function formatDateString(rawDate) {
            if (!rawDate) return "";
            let dateStr = rawDate.toString().trim();
            if (dateStr.includes('T')) {
                dateStr = dateStr.split('T')[0];
            }
            if (dateStr.includes(' ') && !dateStr.includes('-')) {
                const d = new Date(dateStr);
                const day = String(d.getDate()).padStart(2, '0');
                const month = String(d.getMonth() + 1).padStart(2, '0');
                const year = String(d.getFullYear()).slice(-2);
                return `${day}-${month}-${year}`;
            }
            const parts = dateStr.split('-'); 
            if (parts.length === 3) {
                if (parts[0].length === 4) {
                    return `${parts[2]}-${parts[1]}-${parts[0].slice(-2)}`;
                }
                return dateStr;
            }
            return dateStr;
        }
        
        const userData = JSON.parse(localStorage.getItem('facultyUser'));

        if (!userData) {
            window.location.href = 'index.html';
        } else {
            // 🔍 TEMPORARY DEBUGGER ALERT
            alert("Current Session Data:\n" + JSON.stringify(userData, null, 2));

            document.getElementById('facName').innerText = userData.name;
            document.getElementById('initials').innerText = userData.name.charAt(0).toUpperCase();
        }

        if (!userData) {
            window.location.href = 'index.html';
        } else {
            document.getElementById('facName').innerText = userData.name;
            document.getElementById('initials').innerText = userData.name.charAt(0).toUpperCase();
            
            document.getElementById('statPending').innerText = userData.leaveBalance !== undefined ? userData.leaveBalance : "4";
            document.getElementById('statUsed').innerText = userData.usedLeaves !== undefined ? userData.usedLeaves : "0";
            document.getElementById('statTotal').innerText = userData.totalLeaves !== undefined ? userData.totalLeaves : "4";
            if (userData.name.trim() === "Gutti Anshuman" && userData.dept === "Guitar") {
                document.getElementById('facRole').innerText = "Guitar Instructor";
                document.getElementById('backToGatewayBtn').classList.remove('hidden');
            } else if (userData.role === 'Admin') {
                document.getElementById('facRole').innerText = `Admin (${userData.dept} View Mode)`;
                document.getElementById('backToGatewayBtn').classList.remove('hidden');
            } else {
                document.getElementById('facRole').innerText = `${userData.dept} Instructor`;
            }

            // 🔒 BULLETPROOF CALENDAR BLOCKER
            if (userData.regDate) {
                try {
                    // Convert any incoming format safely using a temporary local date instance
                    // Replacing hyphens with slashes or parsing text cleanly avoids timezone drops
                    let rawDateStr = userData.regDate.toString().split('T')[0].split(' ')[0];
                    let d = new Date(rawDateStr.replace(/-/g, '/'));
                    
                    // Fallback check if it's formatted like MM/DD/YYYY or DD-MM-YYYY in your sheet
                    if (isNaN(d.getTime())) {
                        d = new Date(userData.regDate);
                    }

                    if (!isNaN(d.getTime())) {
                        const year = d.getFullYear();
                        const month = String(d.getMonth() + 1).padStart(2, '0');
                        const day = String(d.getDate()).padStart(2, '0');
                        
                        // Construct the absolute standard text needed for HTML5 calendar restrictions
                        const htmlMinFormat = `${year}-${month}-${day}`;
                        
                        const calendarInput = document.getElementById('leaveCalendar');
                        calendarInput.min = htmlMinFormat; // Dynamically forces the restriction attribute
                        calendarInput.value = "";          // Clear out any stale cached values
                        
                        console.log("Calendar min-boundary successfully locked to:", htmlMinFormat);
                    }
                } catch(err) {
                    console.error("Boundary enforcement error:", err);
                }
            }

            fetchUpdatedLeaveNumbers();
            fetchUserLeaveHistory();
        }

        async function fetchUpdatedLeaveNumbers() {
            // Re-fetch to get most up-to-date live tracking balances directly from the spreadsheet columns
            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'login',
                        facultyId: userData.facultyId,
                        password: userData.password || "1234" // Quick structural fallback link
                    })
                });
                const freshData = await response.json();
                if(freshData !== "Fail") {
                    // Update layout metrics using the column structure
                    // The backend recalculates Used, Pending, and Total based on your custom model!
                    document.getElementById('statPending').innerText = freshData.leaveBalance; // Pending (Live balance remaining)
                    
                    // Since your backend parses totals, we can mathematically display the whole layout context cleanly
                    // If you want to pull absolute row columns live, they track dynamically
                    // Let's deduce them seamlessly or display via your local profile payload indicators
                    // To show them explicitly, we read the balance structures
                }
            } catch(e) { 
                // Local Storage structural fallback visualization display tags
                document.getElementById('statPending').innerText = userData.leaveBalance || "4";
            }
            
            // Optional direct manual display values hook:
            // Since we know Pending is your remaining active pool, we map it elegantly:
            // Let's set initial view states dynamically from our local storage object session parameters
            // We will request the script to add a small feature to pass all 3 parameters in a future refactor if needed,
            // but currently, it updates your live Pending pool instantly!
            document.getElementById('statPending').innerText = userData.leaveBalance !== undefined ? userData.leaveBalance : "4";
            
            // To display raw values clearly, we pull them dynamically
            // For now, let's look at your session metrics:
            document.getElementById('statTotal').innerText = "4"; // Baseline
            document.getElementById('statUsed').innerText = (4 - Number(userData.leaveBalance || 4));
        }

        async function fetchUserLeaveHistory() {
            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'fetchLeaves', facultyId: userData.facultyId, role: userData.role })
                });
                const list = await response.json();
                const container = document.getElementById('historyQueue');
                container.innerHTML = '';

                if(list.length === 0) {
                    container.innerHTML = `<tr><td colspan="3" class="text-muted text-center">No leave entries found.</td></tr>`;
                } else {
                    // Render history rows onto the screen safely
                    list.reverse().forEach(item => {
                        let badgeClass = "badge-pending";
                        if(item.status === 'Approved') badgeClass = "badge-approved";
                        if(item.status === 'Rejected') badgeClass = "badge-rejected";

                        container.innerHTML += `
                            <tr>
                                <td>${item.requestId}</td>
                                <td><b>${formatDateString(item.dates)}</b></td>
                                <td><span class="${badgeClass}">${item.status.toUpperCase()}</span></td>
                            </tr>
                        `;
                    });
                }

                // ⚡ BULLETPROOF BALANCE RENDERING:
                // Instead of calculating balances on the client, fetch fresh database row allocations
                if (userData) {
                    // Request fresh profile details to capture live sheet values
                    const updateResp = await fetch(SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action: 'login', facultyId: userData.facultyId, password: userData.password || "1234" })
                    });
                    const freshData = await updateResp.json();
                    
                    if (freshData !== "Fail") {
                        // Update local memory with the fresh backend calculation stats
                        userData.leaveBalance = freshData.leaveBalance;
                        userData.usedLeaves = freshData.usedLeaves;
                        userData.totalLeaves = freshData.totalLeaves;
                        localStorage.setItem('facultyUser', JSON.stringify(userData));

                        // 🇮🇳 Display exactly what your spreadsheet rows hold!
                        document.getElementById('statTotal').innerText = freshData.totalLeaves;     // Shows 12
                        document.getElementById('statUsed').innerText = freshData.usedLeaves;       // Shows 2
                        document.getElementById('statPending').innerText = freshData.leaveBalance;   // Shows 10 
                    }
                }
            } catch(e) { console.log("History balance synchronization failed:", e); }
        }

        async function submitLeaveRequest() {
            const dateVal = document.getElementById('leaveCalendar').value; // Formatted as "YYYY-MM-DD"
            const typeVal = document.getElementById('leaveType').value;
            if(!dateVal) return alert("Please pick a date first.");

            // 🛑 REGISTRATION DATE BOUNDARY VALIDATION
            if (userData.regDate) {
                const regDateCleanText = userData.regDate.toString().split('T')[0].split(' ')[0]; // Absolute text "YYYY-MM-DD"
                
                // When strings are in YYYY-MM-DD format, text comparisons like "<" work perfectly and ignore timezones!
                if (dateVal < regDateCleanText) {
                    return alert(`❌ Access Denied: You cannot request leave before your official registration date (${formatDateString(regDateCleanText)})!`);
                }
            }
            
            // 1. MASTER LIST OF PUBLIC HOLIDAYS (Format: YYYY-MM-DD)
            const publicHolidays = [
                "2026-01-01", // New Year's Day
                "2026-01-14", // Makar Sankranti / Pongal
                "2026-01-26", // Republic Day
                "2026-03-03", // Holi
                "2026-03-19", // Ugadi / Gudi Padwa
                "2026-05-01", // May Day / Labour Day
                "2026-08-15", // Independence Day
                "2026-09-14", // Janmashtami
                "2026-10-02", // Gandhi Jayanti
                "2026-10-20", // Dussehra
                "2026-11-08", // Diwali
                "2026-12-25"  // Christmas Day
            ];

            // 2. HOLIDAY CHECKER
            if (publicHolidays.includes(dateVal)) {
                return alert("❌ Leave requests cannot be submitted for Public Holidays! The academy is already closed.");
            }

            // 3. SUNDAY CHECKER
            // Replacing hyphens with forward slashes keeps browser date engine parses localized and precise
            const targetDate = new Date(dateVal.replace(/-/g, '/')); 
            const dayOfWeek = targetDate.getDay(); // 0 = Sunday, 1 = Monday...
            
            if (dayOfWeek === 0) {
                return alert("❌ Leave requests cannot be submitted for Sundays! Please select a weekday.");
            }
            
            // 4. DATABASE TRANSMISSION IF VALIDATION PASSES
            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'requestLeave',
                        facultyId: userData.facultyId,
                        name: userData.name,
                        dates: dateVal,
                        leaveType: typeVal
                    })
                });
                const result = await response.text();
                if(result === "LEAVE_REQUESTED") {
                    alert(`✅ Leave request submitted successfully!`);
                    fetchUserLeaveHistory(); 
                }
            } catch (e) { alert("Submission failed."); }
        }

        async function logTime(type) {
            try {
                const ipResponse = await fetch('https://api.ipify.org?format=json');
                const ipData = await ipResponse.json();
                
                const payload = {
                    action: 'logAttendance',
                    facultyId: userData.facultyId,
                    name: userData.name,
                    role: userData.dept, 
                    type: type,
                    clientIP: ipData.ip 
                };

                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                const result = await response.text();
                alert(result === "SUCCESS" ? `✅ Recorded: ${type}` : "❌ Access Denied.");
            } catch (e) { alert("Connection error."); }
        }

        function logout() { localStorage.removeItem('facultyUser'); window.location.href = 'index.html'; }
        
    </script>
</body>
</html>
