<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IAM Attendance System - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { 
            background-color: #ffcc00; 
            font-family: 'Lexend', sans-serif;
            color: #ffffff;
            min-height: 100vh;
        }
        .logo-container { text-align: center; margin-top: 40px; }
        .rock-logo { 
            width: 120px; 
            height: 120px; 
            border-radius: 20px; 
            margin-bottom: 15px;
            border: 2px solid #000000;
        }
        .brand-name { font-weight: 700; font-size: 2.2rem; color: #000000; margin-bottom: 0; }
        .brand-sub { color: #000000; font-size: 1rem; margin-bottom: 40px; }
        
        .card { 
            background: #000000;
            border-radius: 24px; 
            border: 1px solid #ffcc00; 
            padding: 40px;
            max-width: 450px;
            margin: 0 auto;
        }
        
        .yellow-text { color: #ffcc00 !important; }
        
        .form-label { font-weight: 700; font-size: 0.8rem; color: #ffcc00; text-transform: uppercase; margin-bottom: 8px; }
        
        .form-control, .form-select {
            background: #ffcc00;
            border: 2px solid #000000; 
            border-radius: 12px;
            padding: 12px 15px;
            color: #000000;
            margin-bottom: 20px;
        }
        .form-control:focus, .form-select:focus { background: #ffcc00; border-color: #ffffff; color: #000000; box-shadow: none; }
        .form-control::placeholder { color: #544c4c; }

        .btn-yellow {
            background: #000;
            color: #ffcc00;
            font-weight: 700;
            border-radius: 12px;
            padding: 12px;
            border: none;
            width: 100%;
            font-size: 1.1rem;
            text-transform: uppercase;
        }
        .btn-yellow:hover { background: #ffcc00; color: #000000; }
        .hidden { display: none; }
        a.yellow-link { color: #ffcc00; text-decoration: none; font-weight: bold; }
        a.yellow-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="logo-container">
        <img src="IAM_logo.png" class="rock-logo" alt="Logo">
        <h1 class="brand-name">IAM Attendance System</h1>
        <p class="brand-sub">Rock Academy Portal</p>
    </div>

    <div id="loginSection" class="card">
        <h2 class="fw-bold mb-1 yellow-text">Faculty Login</h2>
        <p class="mb-4 yellow-text">Enter credentials to proceed</p>
        
        <label class="form-label">Faculty ID</label>
        <input type="text" id="loginId" class="form-control" placeholder="eg. IAM00">
        
        <label class="form-label">Password</label>
        <input type="password" id="loginPass" class="form-control" placeholder="••••••••">
        
        <button class="btn btn-yellow mb-3" id="loginBtn" onclick="handleLogin()">Login as Faculty</button>
        <p class="text-center small yellow-text">New here? <a href="#" onclick="toggleForm('regSection')" class="yellow-link">Register Account</a></p>
    </div>

    <div id="regSection" class="card hidden">
        <h2 class="fw-bold mb-1 yellow-text">Join the Crew</h2>
        <p class="mb-4 yellow-text">Register your faculty account</p>
        
        <label class="form-label">Full Name</label>
        <input type="text" id="regName" class="form-control" placeholder="Firstname Middlename Lastname">
        
        <label class="form-label">Email ID</label>
        <input type="email" id="regEmail" class="form-control" placeholder="abc@gmail.com or @xyzyahoo.com">
        
        <label class="form-label">Password</label>
        <input type="password" id="regPass" class="form-control" placeholder="••••••••">

        <div class="row">
            <div class="col-6">
                <label class="form-label">Department</label>
                <select id="regDept" class="form-select">
                    <option value="Guitar">Guitar</option>
                    <option value="Drums">Drums</option>
                    <option value="Western Vocals">Western Vocals</option>
                    <option value="Keyboard">Keyboard</option>
                    <option value="Non-Teaching">Non-Teaching</option>
                    <option value="Carnatic Vocals">Carnatic Vocals</option>
                </select>
            </div>
            <div class="col-6">
                <label class="form-label">DOB</label>
                <input type="date" id="regDob" class="form-control">
            </div>
        </div>
        
        <button class="btn btn-yellow mb-3" id="regBtn" onclick="handleRegister()">Register Faculty</button>
        <p class="text-center small"><a href="#" onclick="toggleForm('loginSection')" class="yellow-link">Back to Login</a></p>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw_B-F30oaY2TKb0HYWv7fCaMKAZ9Sek8sE6cKEEjN-IQ_-Ko7dNEVMom_r99z_R0f6/exec';

        function toggleForm(id) {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('regSection').classList.add('hidden');
            document.getElementById(id).classList.remove('hidden');
        }

        async function handleLogin() {
            const facultyId = document.getElementById('loginId').value;
            const pass = document.getElementById('loginPass').value;
            const btn = document.getElementById('loginBtn');

            if(!facultyId || !pass) return alert("Please fill all fields");
            btn.disabled = true;

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ 
                        action: 'login', 
                        facultyId: facultyId,
                        password: pass 
                    })
                });
                const rawResponse = await response.text();
                
                if (rawResponse !== "Fail") {
                    let parsedUser = JSON.parse(rawResponse);

                    // 💥 FORCE PURGE: Erases all legacy session time-shifted variables from the device memory completely!
                    localStorage.clear();
                    
                    // 1. 🛡️ MUST BE FIRST: Intercept data and force the Admin update token!
                    if (parsedUser.name.trim() === "Ken Seng Thoumoung" && parsedUser.dept === "Guitar") {
                        parsedUser.role = "Admin";
                    }
                    
                    // 2. Save the fully updated object to localStorage
                    localStorage.setItem('facultyUser', JSON.stringify(parsedUser));
                    
                    // 3. 🚀 NOW check the updated role for routing
                    if (parsedUser.role === 'Admin') {
                        window.location.href = 'bridge.html'; // Validated admin goes to bridge gateway!
                    } else {
                        window.location.href = 'faculty.html'; // Everyone else goes straight to clocking
                    }
                } else {
                    alert("Invalid Faculty ID or Password");
                }
            } catch (error) {
                alert("Connection Error.");
            } finally {
                btn.disabled = false;
            }
        }

        async function handleRegister() {
            const btn = document.getElementById('regBtn');
            const data = {
                action: 'register',
                name: document.getElementById('regName').value.trim(),
                email: document.getElementById('regEmail').value.trim(),
                password: document.getElementById('regPass').value,
                role: document.getElementById('regDept').value, // This saves their Department (e.g., "Guitar") into Column E
                dob: document.getElementById('regDob').value
            };

            if(!data.name || !data.email || !data.password || !data.dob) return alert("Please fill all fields");

            btn.disabled = true;
            btn.innerText = "REGISTERING...";

            try {
                const response = await fetch(SCRIPT_URL, { 
                    method: 'POST', 
                    body: JSON.stringify(data) 
                });
                
                const result = await response.json();
                
                if (result.facultyId) {
                    alert("Registration Complete!\n\nYour Faculty ID is: " + result.facultyId + "\nKeep this safe for login.");
                    toggleForm('loginSection');
                }
            } catch (e) { 
                alert("Registration failed. Please try again."); 
            } finally {
                btn.disabled = false;
                btn.innerText = "Register Faculty";
            }
        }
        
    </script>
</body>
</html>
